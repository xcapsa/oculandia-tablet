name: feed

# Costruisce feed/tablet.json dai dati pubblici del sito e lo salva nel repo.
# Parte solo a mano: così non consuma minuti finché non si decide dove pubblicare.
# Per farlo girare da solo, togliere il commento alle due righe "schedule".
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: cd tools && python3 -m unittest test_build_feed
      - name: Costruisci il feed
        run: python3 tools/build_feed.py --out feed/tablet.json
      - name: Salva se è cambiato
        run: |
          git config user.name "oculandia-tablet-feed"
          git config user.email "feed@users.noreply.github.com"
          git add feed/tablet.json
          # "generato" e "aggiornato" cambiano a ogni giro: si salva solo se cambiano eventi o news.
          if git diff --cached --quiet -I'"generato"' -I'"aggiornato"' 2>/dev/null; then
            echo "Nessuna novità."
          else
            git commit -m "Feed aggiornato"
            git push
          fi
