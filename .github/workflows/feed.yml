name: feed

# Ricostruisce feed/tablet.json e le immagini in feed/img/ dai dati pubblici del sito.
# Gira da solo ogni 30 minuti (il repo è pubblico: i minuti di Actions non si pagano).
# Salva un commit solo se qualcosa è cambiato davvero: lo script riscrive un file
# solo quando cambia il contenuto, quindi immagini identiche non creano commit.
# GitHub Pages pubblica il ramo main: il commit aggiorna anche il sito del feed.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dipendenze
        run: pip install -r requirements.txt
      - name: Test
        run: cd tools && python3 -m unittest test_build_feed
      - name: Costruisci feed e immagini
        run: python3 tools/build_feed.py --out feed/tablet.json
      - name: Salva se è cambiato
        run: |
          git config user.name "oculandia-tablet-feed"
          git config user.email "feed@users.noreply.github.com"
          git add feed/
          if git diff --cached --quiet; then
            echo "Nessuna novità."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Feed aggiornato"
          for tentativo in 1 2 3; do
            git push && exit 0
            sleep $((tentativo * 10))
            git pull --rebase
          done
          exit 1
