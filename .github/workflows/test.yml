name: test

# Esegue i test del feed a ogni push e pull request. Senza rete: usano dati finti.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dipendenze
        run: pip install -r requirements.txt
      - name: Test
        run: cd tools && python3 -m unittest -v test_build_feed
      - name: Il feed pubblicato è valido
        run: |
          python3 - <<'PY'
          import json, pathlib
          dati = pathlib.Path("feed/tablet.json").read_bytes()
          assert len(dati) < 100_000, f"feed troppo grande: {len(dati)} byte"
          feed = json.loads(dati)
          assert feed["v"] == 1
          for prefisso, chiave, quante in (("evento", "eventi", 12), ("news", "news", 10)):
              for n in range(1, quante + 1):
                  assert pathlib.Path(f"feed/img/{prefisso}-{n}.jpg").is_file(), f"manca {prefisso}-{n}.jpg"
          print(f"feed ok: {len(dati)} byte, {len(feed['eventi'])} eventi, {len(feed['news'])} news")
          PY
